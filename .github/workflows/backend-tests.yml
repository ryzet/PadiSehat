name: Backend checks

on:
  push:
    branches:
      - main
      - feat/backend-foundation
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend validation tests
        run: npm test

      - name: Check backend JavaScript syntax
        run: |
          find src tests -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: .
        run: npm run build
